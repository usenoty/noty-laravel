name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [8.2, 8.3, 8.4]
        laravel: ['^10.0', '^11.0', '^12.0']
        dependency-version: ['prefer-lowest', 'prefer-stable']
        exclude:
          # Laravel 10.0.0 (what prefer-lowest pins to) predates official PHP 8.4
          # support and emits deprecation warnings during boot. Newer 10.x patches
          # added 8.4 support, so prefer-stable still runs.
          - php: 8.4
            laravel: '^10.0'
            dependency-version: 'prefer-lowest'

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - ${{ matrix.dependency-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring
          coverage: none

      - name: Pin Laravel version
        run: |
          composer require \
            "illuminate/support:${{ matrix.laravel }}" \
            "illuminate/notifications:${{ matrix.laravel }}" \
            "illuminate/queue:${{ matrix.laravel }}" \
            --no-update --no-interaction

      - name: Install dependencies
        run: composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show

      - name: PHP Code Style
        run: composer cs-check

      - name: Execute tests
        run: vendor/bin/phpunit

  static-analysis:
    runs-on: ubuntu-latest
    name: Static Analysis

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: dom, curl, libxml, mbstring
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction

      - name: Run PHPStan
        run: composer phpstan
