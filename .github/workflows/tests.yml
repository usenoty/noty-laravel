name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        php: [8.1, 8.2, 8.3]
        laravel: ['^10.0', '^11.0']
        dependency-version: ['prefer-lowest', 'prefer-stable']
        exclude:
          - php: 8.1
            laravel: '^11.0'
          - php: 8.2
            laravel: '^11.0'
          - php: 8.3
            laravel: '^10.0'
        include:
          - php: 8.3
            laravel: '^11.0'
            dependency-version: 'prefer-stable'
    
    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - ${{ matrix.dependency-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring
          coverage: none

      - name: Install dependencies
        run: |
          composer require "illuminate/support:${{ matrix.laravel }}" "illuminate/notifications:${{ matrix.laravel }}" "illuminate/queue:${{ matrix.laravel }}" --no-interaction --no-update
          composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show

      - name: Execute tests
        run: vendor/bin/phpunit --verbose

      - name: Generate coverage report
        if: matrix.php == '8.2' && matrix.laravel == '^10.0' && matrix.dependency-version == 'prefer-stable'
        run: |
          composer require --dev phpunit/php-code-coverage
          vendor/bin/phpunit --coverage-clover=coverage.xml

      - name: Upload coverage to Codecov
        if: matrix.php == '8.2' && matrix.laravel == '^10.0' && matrix.dependency-version == 'prefer-stable'
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  static-analysis:
    runs-on: ubuntu-latest
    name: Static Analysis
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: dom, curl, libxml, mbstring
          coverage: none

      - name: Install dependencies
        run: |
          composer require "illuminate/support:^10.0" "illuminate/notifications:^10.0" "illuminate/queue:^10.0" --no-interaction --no-update
          composer update --prefer-dist --no-interaction
          composer require --dev phpstan/phpstan --no-interaction

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G --level=5

